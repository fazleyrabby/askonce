x-app: &app
  image: askonce:production
  env_file: .env.production
  restart: unless-stopped
  stop_grace_period: 90s
  volumes:
    - uploads:/app/storage/app/private
    - backups:/app/storage/app/backups
  networks:
    - askonce
  depends_on:
    postgres:
      condition: service_healthy
    redis:
      condition: service_healthy
    mailpit:
      condition: service_started
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  app:
    <<: *app
    build: .
    mem_limit: 512m
    networks:
      - askonce
      - traefik
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik"
      - 'traefik.http.routers.askonce.rule=Host(`askonce.fazleyrabbi.xyz`)'
      - "traefik.http.routers.askonce.entrypoints=web"
      - "traefik.http.services.askonce.loadbalancer.server.port=8080"
      - "traefik.http.middlewares.askonce-https.headers.customrequestheaders.X-Forwarded-Proto=https"
      - "traefik.http.middlewares.askonce-https.headers.customrequestheaders.X-Forwarded-Port=443"
      - "traefik.http.routers.askonce.middlewares=askonce-https"
      - 'traefik.http.routers.askonce-client.rule=Host(`askonce.fazleyrabbi.xyz`) && PathPrefix(`/r/`)'
      - "traefik.http.routers.askonce-client.entrypoints=web"
      - "traefik.http.routers.askonce-client.service=askonce"
      - "traefik.http.routers.askonce-client.middlewares=askonce-https"
      - "traefik.http.routers.askonce-client.priority=100"
      - "traefik.http.routers.askonce-client.observability.accesslogs=false"
      - "traefik.http.routers.askonce-client.observability.tracing=false"
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@file_get_contents('http://127.0.0.1:8080/up') === false ? 1 : 0);"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
  worker:
    <<: *app
    mem_limit: 384m
    command: ["php", "artisan", "horizon"]
    healthcheck:
      test: ["CMD", "php", "artisan", "horizon:status"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
  scheduler:
    <<: *app
    mem_limit: 256m
    command: ["php", "artisan", "schedule:work"]
    healthcheck:
      test: ["CMD", "php", "-r", "exit(str_contains(file_get_contents('/proc/1/cmdline'), 'schedule:work') ? 0 : 1);"]
      interval: 15s
      timeout: 5s
      retries: 3
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    mem_limit: 256m
    environment:
      POSTGRES_DB: askonce
      POSTGRES_USER: askonce
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env.production}
    volumes:
      - postgres:/var/lib/postgresql/data
    networks:
      - askonce
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U askonce -d askonce"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    mem_limit: 128m
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "96mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis:/data
    networks:
      - askonce
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    mem_limit: 128m
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit:/data
    networks:
      - askonce

volumes:
  postgres:
  redis:
  uploads:
  backups:
  mailpit:

networks:
  askonce:
    driver: bridge
  traefik:
    external: true
